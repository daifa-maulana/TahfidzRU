<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pondok Pesantren Roudlotul Ulum Tahfidz Putra</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        color: #fff;
        overflow: hidden;
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
        transition: opacity 0.5s ease-in-out;
      }
      #splash .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.1;
      }
      #splash .glow-emerald {
        top: 25%;
        left: 25%;
        width: 500px;
        height: 500px;
        background: #10b981;
      }
      #splash .glow-blue {
        bottom: 25%;
        right: 25%;
        width: 500px;
        height: 500px;
        background: #3b82f6;
      }
      #splash .content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 24rem;
        text-align: center;
      }
      #splash .logo-ring {
        width: 6rem;
        height: 6rem;
        border-radius: 50%;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem;
        margin-bottom: 2rem;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        animation: splash-pulse 2s ease-in-out infinite;
      }
      #splash .logo-ring img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #splash h2 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin-bottom: 0.5rem;
      }
      #splash .subtitle {
        font-size: 0.75rem;
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 2rem;
      }
      #splash .loader {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 0.625rem 1rem;
        border-radius: 9999px;
        backdrop-filter: blur(12px);
      }
      #splash .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(16,185,129,0.3);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      #splash .loader-text {
        font-size: 0.75rem;
        color: #cbd5e1;
        font-weight: 500;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.03); }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="glow glow-emerald"></div>
      <div class="glow glow-blue"></div>
      <div class="content">
        <div class="logo-ring">
          <img src="/logo.png" alt="Logo"
               onerror="this.src='https://ui-avatars.com/api/?name=RU&background=A4C95A&color=fff'" />
        </div>
        <h2>Roudlotul 'Ulum</h2>
        <p class="subtitle">PONDOK PESANTREN TAHFIDZ</p>
        <div class="loader">
          <div class="spinner"></div>
          <span class="loader-text">Mohon tunggu sebentar...</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
